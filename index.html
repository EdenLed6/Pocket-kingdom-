<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Pocket Kingdom</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
      }
      #diag {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 999;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        font: 12px/1.4 ui-monospace, monospace;
        padding: 6px 8px;
        max-height: 50vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #diag.empty { display: none; }
      #diag .err { color: #ff8080; }
      #diag .ok  { color: #80ff80; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="diag" class="empty"></div>
    <script>
      // Visible diagnostic overlay so problems show up on a phone without devtools.
      (function () {
        var box = document.getElementById('diag');
        function line(text, cls) {
          box.classList.remove('empty');
          var d = document.createElement('div');
          if (cls) d.className = cls;
          d.textContent = text;
          box.appendChild(d);
        }
        window.__diag = line;
        line('boot ' + new Date().toISOString(), 'ok');
        line('ua ' + navigator.userAgent);
        line('href ' + location.href);
        window.addEventListener('error', function (e) {
          var t = e.target || {};
          var src = t.src || t.href;
          if (src) {
            line('ASSET ERR ' + t.tagName + ' ' + src, 'err');
          } else {
            line('ERR ' + (e.message || e.error) + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'), 'err');
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          line('REJ ' + (e.reason && (e.reason.stack || e.reason.message || e.reason)), 'err');
        });
        // Probe the bundle URL directly so we can see if it 404s.
        var bundleUrl = new URL('./assets/main.js', location.href).href;
        line('probe ' + bundleUrl);
        fetch(bundleUrl, { method: 'GET' }).then(function (r) {
          line('probe -> HTTP ' + r.status + ' ' + r.headers.get('content-type'), r.ok ? 'ok' : 'err');
        }).catch(function (err) {
          line('probe FAIL ' + err.message, 'err');
        });
        // After 4s, if Phaser hasn't reported in, say so loudly.
        setTimeout(function () {
          if (!window.__phaserSeen) line('TIMEOUT: bundle never executed', 'err');
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
