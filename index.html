<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Pocket Kingdom</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        image-rendering: pixelated;
      }
      #diag {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 999;
        background: rgba(0, 0, 0, 0.85);
        color: #ff8080;
        font: 12px/1.4 ui-monospace, monospace;
        padding: 6px 8px;
        max-height: 50vh;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="diag"></div>
    <script>
      // Silent error overlay: invisible until something breaks. Catches both
      // window errors and asset/script load failures (capture-phase).
      (function () {
        var box = document.getElementById('diag');
        function line(text) {
          box.style.display = 'block';
          var d = document.createElement('div');
          d.textContent = text;
          box.appendChild(d);
        }
        window.addEventListener('error', function (e) {
          var t = e.target || {};
          var src = t.src || t.href;
          if (src) {
            line('ASSET ' + t.tagName + ' ' + src);
          } else {
            line('ERR ' + (e.message || e.error) + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'));
          }
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          line('REJ ' + (e.reason && (e.reason.stack || e.reason.message || e.reason)));
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
